{% from 'partials/_media_picture.html' import picture %}
<section class="rx-contact">
    <div class="sec-inner">
        <div class="rx-contact-inner rx-contact-inner--visual">
            <figure class="rx-contact-art" aria-hidden="true">
                {{ picture('/static/assets/images/home/knowbridge.png', '', '', 'lazy', '', 'media-load media-load--hero') }}
            </figure>
            <div class="rx-contact-body">
                <span class="eyebrow">Collaborate</span>
                <h2 class="txt-xbold">The interesting problems are ultradisciplinary.</h2>
                <p>
                    Research infrastructure, e-commerce builds, or something in between — let's talk.
                </p>
                <a href="mailto:{{ contact_email }}" class="btn btn-primary txt-mono uppercase" data-contact-trigger>
                    <i class="ph ph-envelope-simple" aria-hidden="true"></i> Get in touch
                </a>
            </div>
        </div>
    </div>
</section>
