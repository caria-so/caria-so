<div class="mtd-drawer" id="mtd-drawer" hidden aria-hidden="true">
    <button type="button" class="mtd-drawer-backdrop" id="mtd-drawer-backdrop" aria-label="Close method detail"></button>
    <aside class="mtd-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="mtd-detail-title">
        <header class="mtd-drawer-head">
            <h2 class="mtd-detail-title" id="mtd-detail-title"></h2>
            <button type="button" class="mtd-drawer-close" id="mtd-drawer-close" aria-label="Close">
                <i class="ph ph-x"></i>
            </button>
        </header>
        <div class="mtd-drawer-body">
            <p class="mtd-detail-text mtd-detail-desc" id="mtd-detail-desc"></p>
            <div class="mtd-detail-meta" id="mtd-detail-meta"></div>
            <div class="mtd-detail-block">
                <div class="mtd-detail-label">When to use</div>
                <p class="mtd-detail-text" id="mtd-detail-when"></p>
            </div>
            <div class="mtd-detail-block">
                <div class="mtd-detail-label">Watch out</div>
                <p class="mtd-detail-text mtd-detail-watch" id="mtd-detail-watch"></p>
            </div>
            <div class="mtd-detail-block" id="mtd-detail-pairs-wrap" hidden>
                <div class="mtd-detail-label">Pairs well with</div>
                <div class="mtd-pairs" id="mtd-detail-pairs"></div>
            </div>
        </div>
    </aside>
</div>
