services:
  - type: web
    name: caria-so
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py run:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CONTACT_EMAIL
        value: hello@caria.so
      - key: MAIL_FROM
        value: hello@caria.so
      # Impossible Papers pages read multi-MB fingerprint JSON per request.
      # Flip to true once those pages are wanted.
      - key: ENABLE_PAPERS
        value: false
      # SMTP secrets — set these in the Render dashboard, not in git.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
